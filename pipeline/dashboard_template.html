<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fútbol Europeo Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --row-hover: rgba(11, 11, 11, 0.04);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --good: #0ca30c;
    --critical: #d03b3b;
    --neutral: #898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --row-hover: rgba(255, 255, 255, 0.05);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --row-hover: rgba(255, 255, 255, 0.05);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--text-secondary); font-size: 0.9rem; }

  .filters { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 16px; }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--text-secondary); }
  select {
    font: inherit; font-size: 0.95rem; color: var(--text-primary);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 32px 8px 12px; min-width: 180px;
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .card .sub { margin: 0 0 16px; color: var(--text-secondary); font-size: 0.85rem; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { padding: 16px; }
  .kpi .label { font-size: 0.8rem; color: var(--text-secondary); }
  .kpi .value { font-size: 1.9rem; font-weight: 600; margin-top: 2px; }
  .kpi .note { font-size: 0.78rem; color: var(--text-muted); }

  .chart-card { margin-bottom: 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap text { font-size: 12px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
  .chart-wrap text.end-label { fill: var(--text-secondary); font-weight: 500; }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.1s;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 0.8rem; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    min-width: 160px; z-index: 2;
  }
  .tooltip .t-title { color: var(--text-secondary); margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; }
  .tooltip .t-row b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }

  .table-scroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 640px; }
  th { text-align: right; font-weight: 500; color: var(--text-muted); font-size: 0.78rem; padding: 8px 6px; border-bottom: 1px solid var(--axis); }
  td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th.team, td.team { text-align: left; }
  td.team { display: flex; align-items: center; gap: 8px; }
  td.pts { font-weight: 600; }
  tbody tr:hover { background: var(--row-hover); }
  .form { display: inline-flex; gap: 3px; }
  .form i {
    font-style: normal; font-size: 0.7rem; font-weight: 600; color: #fff;
    width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center;
  }
  .form .W { background: var(--good); }
  .form .D { background: var(--neutral); }
  .form .L { background: var(--critical); }
  .empty { color: var(--text-secondary); padding: 24px 0; text-align: center; }
  footer { margin-top: 24px; font-size: 0.8rem; color: var(--text-muted); }
  footer a { color: inherit; }

  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi .value { font-size: 1.5rem; }
    select { min-width: 0; width: 100%; }
    .filters label { flex: 1 1 140px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fútbol europeo</h1>
    <p>Las 5 grandes ligas · actualizado <span id="generated"></span></p>
  </header>

  <div class="filters">
    <label>Liga <select id="league"></select></label>
    <label>Temporada <select id="season"></select></label>
  </div>

  <section class="kpis" id="kpis"></section>

  <section class="card chart-card">
    <h2>Carrera por el título</h2>
    <p class="sub">Puntos acumulados por jornada de los 4 primeros clasificados</p>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chart">
      <div class="tooltip" id="tooltip"></div>
    </div>
  </section>

  <section class="card">
    <h2>Clasificación</h2>
    <p class="sub" id="table-sub"></p>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>#</th><th class="team">Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th>
            <th>GF</th><th>GC</th><th>DG</th><th>Pts</th><th>Últimos 5</th>
          </tr>
        </thead>
        <tbody id="standings"></tbody>
      </table>
    </div>
  </section>

  <footer>
    Datos: <a href="https://github.com/openfootball/football.json">openfootball</a> ·
    Pipeline: Python + DuckDB + dbt, orquestado con GitHub Actions
  </footer>
</main>

<script>
const DATA = /*__DATA__*/null;

const $ = (id) => document.getElementById(id);
const leagueSel = $("league");
const seasonSel = $("season");
const FORM_LABEL = { W: "G", D: "E", L: "P" };
const FORM_TITLE = { W: "Ganado", D: "Empatado", L: "Perdido" };
const SVG_NS = "http://www.w3.org/2000/svg";

function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// "Manchester City FC" -> "Manchester City" para etiquetas compactas
function shortName(team) {
  return team.replace(/\b(FC|CF|AFC|SC|AC|SSC|AS|OGC|RC|SL|SV|VfB|VfL|TSG|1\.\s?FC|Club)\b\.?/g, "")
             .replace(/\bde Fútbol\b/g, "")
             .replace(/\s+/g, " ").trim() || team;
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
}

function fillSelect(sel, values, preferred) {
  sel.innerHTML = values.map((v) => `<option>${escapeHtml(v)}</option>`).join("");
  sel.value = values.includes(preferred) ? preferred : values[values.length - 1];
}

const leagues = [...new Set(DATA.standings.map((r) => r.league_name))].sort();
const seasons = [...new Set(DATA.standings.map((r) => r.season))].sort();
$("generated").textContent = DATA.generated_at;
fillSelect(leagueSel, leagues, recall("league") || "LaLiga");
fillSelect(seasonSel, seasons, recall("season"));

function render() {
  const league = leagueSel.value, season = seasonSel.value;
  store("league", league);
  store("season", season);
  const rows = DATA.standings.filter((r) => r.league_name === league && r.season === season);
  const top = rows.slice(0, 4).map((r, i) => ({ team: r.team, color: `var(--series-${i + 1})` }));
  renderKpis(DATA.summary.find((s) => s.league_name === league && s.season === season));
  renderTable(rows, top);
  renderChart(DATA.progression[`${league}|${season}`] || {}, top);
}

function renderKpis(s) {
  if (!s) { $("kpis").innerHTML = ""; return; }
  const tiles = [
    ["Partidos jugados", s.matches_played, ""],
    ["Goles por partido", s.goals_per_match.toFixed(2), ""],
    ["Victorias locales", `${s.home_win_pct}%`, `Visitantes: ${s.away_win_pct}%`],
    ["Empates", `${s.draw_pct}%`, ""],
  ];
  $("kpis").innerHTML = tiles.map(([label, value, note]) => `
    <div class="card kpi"><div class="label">${label}</div>
    <div class="value">${value}</div><div class="note">${note || "&nbsp;"}</div></div>`).join("");
}

function renderTable(rows, top) {
  const colorOf = Object.fromEntries(top.map((t) => [t.team, t.color]));
  const maxPlayed = Math.max(0, ...rows.map((r) => r.played));
  $("table-sub").textContent = rows.length ? `${rows.length} equipos · ${maxPlayed} jornadas disputadas` : "";
  if (!rows.length) {
    $("standings").innerHTML = `<tr><td colspan="11" class="empty">Sin partidos jugados todavía</td></tr>`;
    return;
  }
  $("standings").innerHTML = rows.map((r) => {
    const dot = colorOf[r.team]
      ? `<span class="swatch" style="background:${colorOf[r.team]}"></span>`
      : `<span class="swatch"></span>`;
    const form = (r.last_5 || "").split("").map((c) =>
      `<i class="${c}" title="${FORM_TITLE[c]}">${FORM_LABEL[c]}</i>`).join("");
    const gd = r.goal_diff > 0 ? `+${r.goal_diff}` : r.goal_diff;
    return `<tr><td>${r.position}</td><td class="team">${dot}${escapeHtml(r.team)}</td>
      <td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td>
      <td>${r.goals_for}</td><td>${r.goals_against}</td><td>${gd}</td>
      <td class="pts">${r.points}</td><td><span class="form">${form}</span></td></tr>`;
  }).join("");
}

function el(tag, attrs, parent) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

function renderChart(progression, top) {
  const wrap = $("chart"), tooltip = $("tooltip");
  wrap.querySelector("svg")?.remove();
  wrap.querySelector(".empty")?.remove();
  const series = top.map((t) => ({ ...t, pts: [0, ...(progression[t.team] || [])] }));

  $("legend").innerHTML = series.map((s) =>
    `<span><i class="swatch" style="background:${s.color}"></i>${escapeHtml(shortName(s.team))}</span>`).join("");
  if (!series.length || series.every((s) => s.pts.length < 2)) {
    wrap.insertAdjacentHTML("beforeend", `<div class="empty">Sin partidos jugados todavía</div>`);
    return;
  }

  const W = Math.max(wrap.clientWidth, 300), H = W < 500 ? 260 : 320;
  const m = { top: 12, right: W < 500 ? 84 : 128, bottom: 30, left: 34 };
  const maxX = Math.max(...series.map((s) => s.pts.length - 1));
  const maxPts = Math.max(...series.flatMap((s) => s.pts));
  const step = maxPts > 60 ? 20 : maxPts > 25 ? 10 : 5;
  const maxY = Math.max(step, Math.ceil(maxPts / step) * step);
  const x = (j) => m.left + (j / Math.max(maxX, 1)) * (W - m.left - m.right);
  const y = (p) => H - m.bottom - (p / maxY) * (H - m.top - m.bottom);

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Puntos acumulados por jornada de los cuatro primeros" });
  wrap.prepend(svg);

  for (let v = 0; v <= maxY; v += step) {
    el("line", { x1: m.left, x2: W - m.right, y1: y(v), y2: y(v),
      stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: m.left - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = v;
  }
  const xStep = maxX > 20 ? 5 : maxX > 8 ? 2 : 1;
  for (let j = xStep; j <= maxX; j += xStep) {
    el("text", { x: x(j), y: H - m.bottom + 18, "text-anchor": "middle" }, svg).textContent = j;
  }
  el("text", { x: m.left, y: H - 2, "text-anchor": "start" }, svg).textContent = "Jornada";

  for (const s of series) {
    const d = s.pts.map((p, j) => `${j ? "L" : "M"}${x(j).toFixed(1)},${y(p).toFixed(1)}`).join("");
    el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  }

  // etiquetas directas al final de cada línea, separadas para que no se pisen
  const labels = series.map((s) => ({ s, ly: y(s.pts[s.pts.length - 1]), lx: x(s.pts.length - 1) }))
                       .sort((a, b) => a.ly - b.ly);
  for (let i = 1; i < labels.length; i++) {
    labels[i].ly = Math.max(labels[i].ly, labels[i - 1].ly + 14);
  }
  for (const { s, ly, lx } of labels) {
    const last = s.pts[s.pts.length - 1];
    el("circle", { cx: lx, cy: y(last), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
    const name = shortName(s.team);
    const t = el("text", { x: lx + 8, y: ly + 4, class: "end-label" }, svg);
    t.textContent = `${truncate(name, W < 500 ? 9 : 16)} ${last}`;
  }

  // capa de hover: línea vertical + puntos + tooltip con todos los equipos
  const cross = el("line", { y1: m.top, y2: H - m.bottom, stroke: "var(--axis)", "stroke-width": 1, opacity: 0 }, svg);
  const dots = series.map((s) => el("circle", { r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, opacity: 0 }, svg));
  const hit = el("rect", { x: m.left, y: m.top, width: W - m.left - m.right, height: H - m.top - m.bottom,
    fill: "transparent" }, svg);

  function show(evt) {
    const rect = svg.getBoundingClientRect();
    const px = (evt.clientX - rect.left) * (W / rect.width);
    const j = Math.max(1, Math.min(maxX, Math.round(((px - m.left) / (W - m.left - m.right)) * maxX)));
    cross.setAttribute("x1", x(j)); cross.setAttribute("x2", x(j)); cross.setAttribute("opacity", 1);
    const rowsAt = series.map((s, i) => {
      const p = s.pts[Math.min(j, s.pts.length - 1)];
      dots[i].setAttribute("cx", x(Math.min(j, s.pts.length - 1)));
      dots[i].setAttribute("cy", y(p));
      dots[i].setAttribute("opacity", 1);
      return { s, p };
    }).sort((a, b) => b.p - a.p);
    tooltip.innerHTML = `<div class="t-title">Jornada ${j}</div>` + rowsAt.map(({ s, p }) =>
      `<div class="t-row"><i class="swatch" style="background:${s.color}"></i>${escapeHtml(shortName(s.team))}<b>${p} pts</b></div>`).join("");
    const left = (x(j) / W) * rect.width;
    tooltip.style.left = `${left > rect.width / 2 ? left - tooltip.offsetWidth - 12 : left + 12}px`;
    tooltip.style.top = "8px";
    tooltip.style.opacity = 1;
  }
  function hide() {
    tooltip.style.opacity = 0;
    cross.setAttribute("opacity", 0);
    dots.forEach((d) => d.setAttribute("opacity", 0));
  }
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
}

leagueSel.addEventListener("change", render);
seasonSel.addEventListener("change", render);
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
render();
</script>
</body>
</html>
