version: 2

models:
  - name: int_team_matches
    description: Un partido jugado por equipo (cada partido aparece dos veces).
    columns:
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ["W", "D", "L"]
      - name: venue
        data_tests:
          - accepted_values:
              arguments:
                values: ["home", "away"]
